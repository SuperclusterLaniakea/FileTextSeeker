[package]
name = "toolsnest"
version = "1.1.0"
edition = "2021"
description = "ToolsNest - all-in-one file toolbox"
build = "build.rs"

[[bin]]
name = "ToolsNest"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui_extras = "0.36.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
rfd = "0.15"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"

walkdir = "2"
notify = "8"
crossbeam-channel = "0.5"
crossbeam = "0.8"
rayon = "1"
regex = "1"
glob = "0.3"
once_cell = "1"

chrono = { version = "0.4", features = ["serde"] }
md5 = "0.7"
sha1 = "0.10"
blake3 = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crc32fast = "1"
filetime = "0.2"
rand = "0.8"
unicode-normalization = "0.1"
encoding_rs = "0.8"
chardetng = "0.1"
infer = "0.19"

trash = "5"

tantivy = "0.22"
jieba-rs = "0.7"
pdf-extract = "0.7"
calamine = "0.26"
zip = "=2.2.0"
quick-xml = "0.37"

csv = "1.3"
rust_xlsxwriter = "0.77"
open = "5"

anyhow = "1"
thiserror = "2"

winapi = { version = "0.3", features = [
    "shellapi", "winuser", "windef", "windowsx", "libloaderapi",
    "processthreadsapi", "synchapi", "securitybaseapi", "winbase",
    "winreg", "winerror", "errhandlingapi", "psapi", "handleapi",
    "wingdi", "commctrl", "shlobj", "objbase", "knownfolders",
    "fileapi", "ioapiset", "minwinbase", "minwindef", "shellscalingapi",
] }
winreg = "0.52"
ico = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }

[build-dependencies]
embed-resource = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true

[profile.test]
opt-level = 1
